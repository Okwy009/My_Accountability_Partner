<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAP — Input Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --bg: #0c0c0a;
      --bg2: #141412;
      --bg3: #1a1a17;
      --border: rgba(255,255,255,0.07);
      --text: #f0ece3;
      --muted: #8a8880;
      --accent: #ff6b35;
      --green: #4ade80;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; padding: 0; background: #0c0c0a; }
    #wrap {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px 1fr;
    }
    .sidebar {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 0 20px 24px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
      color: var(--text);
    }
    .logo-mark {
      width: 34px; height: 34px; background: var(--accent); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .logo-name { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
      font-size: 13.5px; color: var(--muted); cursor: pointer;
      border-left: 2px solid transparent; transition: 0.15s; text-decoration: none;
    }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .nav-item.active { color: var(--text); background: rgba(255,107,53,0.08); border-left: 2px solid var(--accent); }
    .nav-section { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; padding: 16px 20px 6px; }
    .main { padding: 28px 28px 48px; overflow-y: auto; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .page-title { font-size: 22px; font-weight: 400; letter-spacing: -0.02em; }
    .page-title span { color: var(--accent); font-style: italic; font-family: Georgia, serif; }
    .date-pill {
      font-size: 12px; color: var(--muted); background: var(--bg2);
      border: 1px solid var(--border); padding: 6px 14px; border-radius: 99px;
      display: flex; align-items: center; gap: 6px;
    }
    .dot-live { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
    .input-cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
    .icard { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .icard-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .icard-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .ic-orange { background: rgba(255,107,53,0.15); color: var(--accent); }
    .ic-green { background: rgba(74,222,128,0.12); color: var(--green); }
    .ic-amber { background: rgba(245,158,11,0.12); color: var(--amber); }
    .ic-purple { background: rgba(167,139,250,0.12); color: #a78bfa; }
    .icard-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
    .icard-count { font-size: 30px; font-family: Georgia, serif; color: var(--text); line-height: 1; margin-bottom: 4px; }
    .icard-sub { font-size: 11px; color: var(--muted); }
    .stepper { display: flex; align-items: center; gap: 6px; }
    .step-btn {
      width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg3); color: var(--text); font-size: 16px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: 0.15s; line-height: 1; font-family: monospace;
    }
    .step-btn:hover { background: rgba(255,107,53,0.15); border-color: var(--accent); color: var(--accent); }
    .step-val { font-size: 16px; font-weight: 600; min-width: 24px; text-align: center; font-family: Georgia, serif; }
    .form-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .form-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .form-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label { font-size: 12px; color: var(--muted); }
    .field input, .field textarea, .field select {
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 13.5px; padding: 10px 13px;
      font-family: 'DM Sans', sans-serif; outline: none; transition: 0.15s; width: 100%;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: rgba(255,107,53,0.4); background: rgba(255,107,53,0.04);
    }
    .field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
    .field select option { background: #1a1a17; }
    .field-full { grid-column: 1 / -1; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag {
      font-size: 11.5px; padding: 5px 12px; border-radius: 99px;
      border: 1px solid var(--border); background: var(--bg3);
      color: var(--muted); cursor: pointer; transition: 0.15s;
    }
    .tag.selected { border-color: var(--accent); background: rgba(255,107,53,0.1); color: var(--accent); }
    .submit-row { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
    .btn-log {
      background: var(--accent); color: white; border: none; padding: 11px 24px;
      border-radius: 99px; font-size: 13.5px; font-weight: 600; cursor: pointer;
      font-family: 'DM Sans', sans-serif; transition: 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .btn-log:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-clear {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 11px 20px; border-radius: 99px; font-size: 13.5px; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }
    .save-msg { font-size: 12px; color: var(--green); opacity: 0; transition: 0.3s; display: flex; align-items: center; gap: 4px; }
    .save-msg.show { opacity: 1; }
    .history-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .history-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .history-count { font-size: 11px; color: var(--muted); background: var(--bg3); border: 1px solid var(--border); padding: 3px 10px; border-radius: 99px; }
    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-row {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 14px; background: var(--bg3); border-radius: 12px; border: 1px solid var(--border);
    }
    .log-time { font-size: 11px; color: var(--muted); min-width: 44px; font-family: monospace; }
    .log-type { font-size: 11px; padding: 3px 10px; border-radius: 99px; min-width: 80px; text-align: center; }
    .lt-comment { background: rgba(255,107,53,0.1); color: var(--accent); }
    .lt-note { background: rgba(74,222,128,0.1); color: var(--green); }
    .lt-reply { background: rgba(245,158,11,0.1); color: var(--amber); }
    .lt-nl { background: rgba(167,139,250,0.1); color: #a78bfa; }
    .log-text { font-size: 13px; color: var(--text); flex: 1; line-height: 1.4; }
    .log-impact { font-size: 11px; color: var(--muted); }

    @media (max-width: 768px) {
      #wrap { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .input-cards { grid-template-columns: repeat(2,1fr); }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
