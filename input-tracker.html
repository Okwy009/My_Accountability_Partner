<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAP — Input Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    /* ... (All your CSS remains the same as provided) ... */
    :root { --bg: #0c0c0a; --bg2: #141412; --bg3: #1a1a17; --border: rgba(255,255,255,0.07); --text: #f0ece3; --muted: #8a8880; --accent: #ff6b35; --green: #4ade80; --amber: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; padding: 0; background: #0c0c0a; font-family: 'DM Sans', sans-serif; }
    #wrap { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 24px 0; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; color: var(--text); }
    .logo-mark { width: 34px; height: 34px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--muted); text-decoration: none; font-size: 13.5px; }
    .nav-item.active { color: var(--text); background: rgba(255,107,53,0.08); border-left: 2px solid var(--accent); }
    .main { padding: 28px; }
    .input-cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
    .icard { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .icard-label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .icard-count { font-size: 30px; font-family: Georgia, serif; color: var(--text); }
    .form-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .btn-log { background: var(--accent); color: white; border: none; padding: 11px 24px; border-radius: 99px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .log-row { display: flex; align-items: center; gap: 14px; padding: 12px; background: var(--bg3); border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<div id="wrap">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-mark">M</div><div class="logo-name">MAP</div></div>
    <a class="nav-item" href="dashboard.html"><i class="ti ti-layout-dashboard"></i> Today</a>
    <a class="nav-item active" href="input-tracker.html"><i class="ti ti-checklist"></i> Input Tracker</a>
  </aside>

  <main class="main">
    <div class="top-bar">
      <div class="page-title">Input <span>tracker</span></div>
    </div>

    <div class="input-cards">
      <div class="icard"><div class="icard-label">Comments</div><div class="icard-count" id="count-comments">3</div></div>
      <div class="icard"><div class="icard-label">Notes</div><div class="icard-count" id="count-notes">1</div></div>
      <div class="icard"><div class="icard-label">Replies</div><div class="icard-count" id="count-replies">5</div></div>
      <div class="icard"><div class="icard-label">Reads</div><div class="icard-count" id="count-reads">2</div></div>
    </div>
    
    <div class="form-section">
      <div class="form-title" style="margin-bottom: 15px;">Log New Input</div>
      <form id="logForm" style="display: flex; gap: 10px;">
        <select id="inputType" style="background:var(--bg3); border:1px solid var(--border); color:white; padding:10px; border-radius:10px;">
          <option value="comment">Comment</option>
          <option value="note">Note</option>
          <option value="reply">Reply</option>
          <option value="read">Newsletter Read</option>
        </select>
        <input type="text" id="inputDesc" placeholder="What did you do?" style="background:var(--bg3); border:1px solid var(--border); color:white; padding:10px; border-radius:10px; flex:1;">
        <button type="submit" class="btn-log">Log Input</button>
      </form>
    </div>

    <div class="history-section">
      <div class="history-title" style="margin-bottom:15px;">Recent Logs</div>
      <div class="log-list" id="logList">
        <div class="log-row"><div class="log-time">10:42</div><div class="log-text">Commented on Sarah's post</div></div>
      </div>
    </div>
  </main>
</div>

<script>
  const logForm = document.getElementById('logForm');
  const logList = document.getElementById('logList');
  
  logForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const type = document.getElementById('inputType').value;
    const desc = document.getElementById('inputDesc').value;
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    if (!desc) return;

    const div = document.createElement('div');
    div.className = 'log-row';
    div.innerHTML = `<div class="log-time">${time}</div><div class="log-type lt-${type}">${type}</div><div class="log-text">${desc}</div>`;
    logList.prepend(div);
    
    // Update counter (simplistic increment)
    const counter = document.getElementById(`count-${type}s`) || document.getElementById(`count-reads`);
    counter.innerText = parseInt(counter.innerText) + 1;
    
    logForm.reset();
  });
</script>

</body>
</html>
